<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline · Nityasādhanā (नित्यसाधना)</title>
  <meta name="theme-color" content="#EAF7F4">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #EAF7F4;
      color: #193B3B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(63, 148, 149, 0.16);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(63, 148, 149, 0.08);
    }
    .img-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      margin: 0 auto 16px auto;
      border: 1px solid rgba(63, 148, 149, 0.2);
      box-shadow: 0 2px 8px rgba(63, 148, 149, 0.1);
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #193B3B;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .sanskrit {
      font-size: 13px;
      color: #A9824D;
      font-weight: 600;
      margin-bottom: 10px;
      font-family: Georgia, serif;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: #547070;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #3F9495;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #337B7C;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="img-wrap">
      <img src="/images/devotional-path-empty.jpg" alt="" />
    </div>
    <h1>You are offline</h1>
    <div class="sanskrit">शान्तिः • Offline Mode</div>
    <p>Sādhanā reports saved on this device will synchronize when connection returns.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
