<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline · Nityasādhanā (नित्यसाधना)</title>
  <meta name="theme-color" content="#F7F1E5">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F7F1E5;
      color: #20201D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(32, 32, 29, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(32, 32, 29, 0.04);
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(61, 118, 91, 0.1);
      color: #3D765B;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #20201D;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .sanskrit {
      font-size: 13px;
      color: #D9822B;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #66635D;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #2457A6;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1B4280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h20M12 2v20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07" opacity="0.3"/>
        <path d="M12 3a9 9 0 0 0-9 9c0 4.97 4.03 9 9 9 4.14 0 7.63-2.8 8.66-6.64"/>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <div class="sanskrit">शान्तिः • Offline Mode</div>
    <p>Your network connection is unavailable. Any daily Sādhanā reports entered locally remain saved safely on this device and will synchronize as soon as connection returns.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
