services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: tejassalunkhe@123
      MYSQL_DATABASE: docker_db
      MYSQL_USER: nityasadhana
